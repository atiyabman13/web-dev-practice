<DOCTYPE html>
<html>
<head>
    <title>Contact Us - Sweet Treats</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff5f7;
            color: #5a4a4a;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #d85c7a;
            text-align: center;
        }

        h2 {
            color: #7b9b8a;
            margin-top: 25px;
        }

        p {
            background-color: #ffffff;
            padding: 12px;
            border-left: 5px solid #f3a6b8;
            border-radius: 8px;
            line-height: 1.6;
        }

        form {
            background-color: #f0f8f4;
            padding: 25px;
            border-radius: 12px;
            width: 400px;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            padding: 8px;
            border: 1px solid #d8a5b2;
            border-radius: 6px;
            margin-top: 5px;
        }

        input[type="submit"] {
            background-color: #d85c7a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #7b9b8a;
        }

        a {
            color: #d85c7a;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #7b9b8a;
        }
    </style>
</head>

<body>

    <h1>💌 Contact Sweet Treats 💌</h1>

    <p>
        Have a question or want to order a cake?
        Send us a message using the form below.
    </p>

    <h2>📞 Contact Details</h2>

    <p>Email: sweettreats@example.com</p>

    <p>Phone: 9876543210</p>

    <h2>🍰 Send Us a Message</h2>

    <form>

        <label>Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Message:</label>
        <br>

        <textarea name="message" rows="5" cols="40"
                  placeholder="Write your message here..."
                  required></textarea>

        <br><br>

        <input type="submit" value="Send Message">

    </form>

    <h2>🌸 Explore Our Website</h2>

    <a href="home.html">Home</a> |
    <a href="about.html">About Us</a> |
    <a href="contact.html">Contact Us</a>

</body>
</html>
