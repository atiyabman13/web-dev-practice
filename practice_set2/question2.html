<!DOCTYPE html>
<html>

<head>
    <title>Flexbox Centering</title>

    <style>

        body {
            margin: 0;
        }

        .container {
            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background-color: #e8f5e9;
        }

        .box {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px #aaa;
        }

        h1 {
            color: #2e7d32;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="box">

            <h1>Hello!</h1>

            <p>
                This box is centered horizontally
                and vertically.
            </p>

        </div>

    </div>

</body>

</html>
