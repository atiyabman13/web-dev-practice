<!DOCTYPE html>
<html>

<head>
    <title>Hover Effects</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f7fb;
            padding: 50px;
        }

        h1 {
            color: #304f9f;
        }

        a {
            color: #3366cc;
            text-decoration: none;
            font-size: 20px;
        }

        a:hover {
            color: #d35400;
            text-decoration: underline;
        }

        button {
            margin-top: 30px;
            padding: 12px 25px;
            background-color: #526da8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #304f9f;
            transform: scale(1.05);
        }

    </style>

</head>

<body>

    <h1>Hover Effects</h1>

    <p>
        Move your mouse over the link and button.
    </p>

    <p>
        <a href="#">Visit My Profile</a>
    </p>

    <button>
        Click Me
    </button>

</body>

</html>
